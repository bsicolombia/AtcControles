{% if is_paginated %}
<div class="paginacion">
  <span>Página {{ page_obj.number }} de {{ paginator.num_pages }} · {{ paginator.count }} registros</span>
  <div>
    {% if page_obj.has_previous %}<a class="btn btn-chico" href="?{% if qs %}{{ qs }}&{% endif %}page={{ page_obj.previous_page_number }}">Anterior</a>{% endif %}
    {% if page_obj.has_next %}<a class="btn btn-chico" href="?{% if qs %}{{ qs }}&{% endif %}page={{ page_obj.next_page_number }}">Siguiente</a>{% endif %}
  </div>
</div>
{% endif %}
