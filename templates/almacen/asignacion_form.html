{% extends "form.html" %}
{% block extra_js %}
<link href="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/css/tom-select.default.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/js/tom-select.complete.min.js"></script>

<script>
(function () {
  var prod = document.getElementById("id_producto");
  var unidad = document.getElementById("id_unidad");
  var tecnico = document.getElementById("id_tecnico");
  var campoU = document.getElementById("campo-unidad");
  var cant = document.getElementById("id_cantidad");
  var url = "{% url 'almacen:api_unidades' %}";
  var previa = unidad.value;

  // Aviso de stock: se crea UNA sola vez, fuera de cargar()
  var aviso = document.createElement("div");
  aviso.style.cssText = "margin-top:6px;font-size:13px;font-weight:600;";
  cant.parentNode.appendChild(aviso);

  function mostrarStock(stock, serializado) {
    var txt = serializado ? "unidad(es) disponible(s)" : "disponible(s) en almacén";
    aviso.textContent = "Stock: " + stock + " " + txt;
    aviso.style.color = stock > 0 ? "#2d6a4f" : "#b42318";
  }

  function validarCantidad(stock) {
    var pedido = parseInt(cant.value, 10);
    if (!Number.isNaN(pedido) && pedido > stock) {
      aviso.textContent = "Solo hay " + stock + " disponible(s) y está pidiendo " + pedido + ".";
      aviso.style.color = "#b42318";
    }
  }

  var tsTecnico = new TomSelect(tecnico, {
    placeholder: "Escriba para buscar un técnico...",
    maxOptions: 200
  });
  var tsUnidad = new TomSelect(unidad, {
    placeholder: "Escriba para buscar un código...",
    maxOptions: 500
  });
  var tsProd = new TomSelect(prod, {
    placeholder: "Escriba para buscar un producto...",
    maxOptions: 200
  });

  function cargar() {
    var valor = tsProd.getValue();
    if (!valor) {
      campoU.style.display = "none";
      aviso.textContent = "";
      return;
    }

    fetch(url + "?producto=" + valor)
      .then(function (r) { return r.json(); })
      .then(function (d) {
        var ayuda = campoU.querySelector(".ayuda");
        var stockActual = d.stock;

        if (d.serializado) {
          campoU.style.display = "";
          cant.value = 1;
          cant.readOnly = true;
          cant.oninput = null;

          tsUnidad.clear(true);
          tsUnidad.clearOptions();
          d.unidades.forEach(function (u) {
            tsUnidad.addOption({ value: String(u.id), text: u.texto });
          });
          tsUnidad.refreshOptions(false);

          if (previa) tsUnidad.setValue(previa, true);

          if (!d.unidades.length && ayuda) {
            ayuda.textContent = "No hay unidades disponibles de este producto.";
          }
        } else {
          campoU.style.display = "none";
          tsUnidad.clear(true);
          cant.readOnly = false;
          cant.max = stockActual;
          cant.oninput = function () {
            mostrarStock(stockActual, false);
            validarCantidad(stockActual);
          };
        }

        mostrarStock(stockActual, d.serializado);
      });
  }

  tsProd.on("change", function () {
    previa = "";
    cargar();
  });

  cargar();
})();
</script>
{% endblock %}
