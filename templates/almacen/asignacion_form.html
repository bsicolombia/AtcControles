{% extends "form.html" %}
{% block extra_js %}
<link href="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/css/tom-select.default.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/js/tom-select.complete.min.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function () {

    var prod = document.getElementById("id_producto");
    var unidad = document.getElementById("id_unidad");
    var tecnico = document.getElementById("id_tecnico");
    var campoU = document.getElementById("campo-unidad");
    var cant = document.getElementById("id_cantidad");

    var url = "{% url 'almacen:api_unidades' %}";

    if (!prod || !unidad || !cant || !campoU) {
        console.error("No se encontraron todos los campos necesarios.");
        return;
    }

    var previa = unidad.value;
    var stockActual = 0;
    var productoSerializado = false;

    // Aviso de stock
    var aviso = document.createElement("div");

    aviso.style.cssText =
        "margin-top:6px;font-size:13px;font-weight:600;";

    cant.parentNode.appendChild(aviso);

    function mostrarStock(stock, serializado) {

        var txt = serializado
            ? "unidad(es) disponible(s)"
            : "disponible(s) en almacén";

        aviso.textContent = "Stock: " + stock + " " + txt;

        aviso.style.color = stock > 0
            ? "#2d6a4f"
            : "#b42318";
    }

    function validarCantidad() {

        var pedido = parseInt(cant.value, 10);

        if (Number.isNaN(pedido) || pedido < 1) {
            cant.setCustomValidity("");
            return;
        }

        if (pedido > stockActual) {

            cant.setCustomValidity(
                "La cantidad supera el stock disponible (" +
                stockActual + ")."
            );

            aviso.textContent =
                "Solo hay " + stockActual +
                " disponibles y está solicitando " + pedido + ".";

            aviso.style.color = "#b42318";

        } else {

            cant.setCustomValidity("");
            mostrarStock(stockActual, false);
        }
    }

    // Inicializar Tom Select
    var tsTecnico = tecnico
        ? new TomSelect(tecnico, {
            placeholder: "Escriba para buscar un técnico...",
            maxOptions: 200
        })
        : null;

    var tsUnidad = new TomSelect(unidad, {
        placeholder: "Escriba para buscar un código...",
        maxOptions: 500
    });

    var tsProd = new TomSelect(prod, {
        placeholder: "Escriba para buscar un producto...",
        maxOptions: 200
    });

    // Estado inicial
    campoU.style.display = "none";
    cant.readOnly = false;
    cant.disabled = false;
    cant.removeAttribute("max");

    // Cargar información del producto
    function cargar() {

        var valor = tsProd.getValue();

        if (!valor) {

            campoU.style.display = "none";

            cant.value = "";
            cant.readOnly = false;
            cant.disabled = false;
            cant.removeAttribute("max");

            aviso.textContent = "";

            tsUnidad.clear(true);
            tsUnidad.clearOptions();
            tsUnidad.refreshOptions(false);

            return;
        }

        fetch(url + "?producto=" + encodeURIComponent(valor))
            .then(function (r) {

                if (!r.ok) {
                    throw new Error("Error consultando el stock");
                }

                return r.json();
            })
            .then(function (d) {

                stockActual = Number(d.stock) || 0;
                productoSerializado = Boolean(d.serializado);

                if (productoSerializado) {

                    // PRODUCTO SERIALIZADO
                    campoU.style.display = "";

                    cant.value = 1;
                    cant.readOnly = true;
                    cant.disabled = false;
                    cant.removeAttribute("max");

                    cant.setCustomValidity("");

                    tsUnidad.clear(true);
                    tsUnidad.clearOptions();

                    (d.unidades || []).forEach(function (u) {

                        tsUnidad.addOption({
                            value: String(u.id),
                            text: u.texto
                        });

                    });

                    tsUnidad.refreshOptions(false);

                    if (
                        previa &&
                        d.unidades.some(function(u) {
                            return String(u.id) === String(previa);
                        })
                    ) {
                        tsUnidad.setValue(previa, true);
                    }

                    var ayuda = campoU.querySelector(".ayuda");

                    if (ayuda) {

                        ayuda.textContent = d.unidades.length
                            ? "Seleccione la unidad que desea retirar."
                            : "No hay unidades disponibles de este producto.";
                    }

                } else {

                    // PRODUCTO NORMAL
                    campoU.style.display = "none";

                    tsUnidad.clear(true);
                    tsUnidad.clearOptions();
                    tsUnidad.refreshOptions(false);

                    cant.readOnly = false;
                    cant.disabled = false;

                    cant.min = 1;
                    cant.max = stockActual;

                    cant.value = "";

                    cant.setCustomValidity("");

                }

                mostrarStock(stockActual, productoSerializado);

            })
            .catch(function(error) {

                console.error("Error al consultar producto:", error);

                campoU.style.display = "none";

                cant.readOnly = false;
                cant.disabled = false;
                cant.removeAttribute("max");

                aviso.textContent =
                    "No fue posible consultar el stock.";

                aviso.style.color = "#b42318";

            });
    }

    // Cambio de producto
    tsProd.on("change", function () {

        previa = "";

        cargar();

    });

    // Validar cantidad manual
    cant.addEventListener("input", function() {

        if (!productoSerializado) {
            validarCantidad();
        }

    });

    // Cambio de unidad serializada
    tsUnidad.on("change", function() {

        if (productoSerializado) {
            cant.value = 1;
        }

    });

    // Carga inicial
    cargar();

});
</script>
{% endblock %}
